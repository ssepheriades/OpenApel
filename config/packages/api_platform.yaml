api_platform:
    title: 'OpenApel API'
    version: '1.0.0'
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        pagination_items_per_page: 30
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    swagger:
        api_keys:
            Bearer:
                name: Authorization
                type: header

when@prod:
    api_platform:
        enable_docs: false
        enable_swagger_ui: false
