# Reference / smoke-test Compose. Prefer Coolify "Dockerfile" build pack +
# separate PostgreSQL 18 resource in production (see DEPLOY_COOLIFY.md).
#
# Coolify Traefik terminates TLS — do not publish app ports on the host in prod.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      # Prefer OPENAPEL_* so Compose does not reuse Symfony .env APP_* for local smoke.
      APP_SECRET: ${OPENAPEL_APP_SECRET:-change_me_local_smoke_only}
      APP_INSTANCE: ${OPENAPEL_APP_INSTANCE:-smoke}
      UPLOAD_DIR: /app/var/storage
      DATABASE_URL: ${OPENAPEL_DATABASE_URL:-postgresql://openapel:openapel@database:5432/openapel?serverVersion=18&charset=utf8}
      MAILER_DSN: ${OPENAPEL_MAILER_DSN:-null://null}
      DEFAULT_URI: ${OPENAPEL_DEFAULT_URI:-http://localhost:8080}
      TRUSTED_PROXIES: ${OPENAPEL_TRUSTED_PROXIES:-REMOTE_ADDR}
      SERVER_NAME: ':8080'
    volumes:
      - openapel_uploads:/app/var/storage
    ports:
      - '${APP_PUBLISH_PORT:-8080}:8080'
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openapel
      POSTGRES_USER: openapel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openapel}
    # PG 18+ official image: mount parent dir (not .../data) — see docker-library/postgres#1259
    volumes:
      - openapel_pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openapel -d openapel']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openapel_uploads:
  openapel_pg:
